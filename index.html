<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حساب Firebase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="page-shell">
        <div class="account-panel">
            <div class="account-row">
                <div class="settings-button" aria-label="الإعدادات" title="الإعدادات">
                    <i class="fa-solid fa-gear"></i>
                </div>

                <div class="account-left">
                    <div class="status-group">
                        <span class="status-pill danger">تسجيل الخروج</span>
                        <span class="status-pill success">متصلة Firebase</span>
                    </div>

                    <div class="welcome-box">
                        <label class="welcome-label" for="userName">اهلاً</label>
                        <input id="userName" type="text" placeholder="اكتب اسمك" maxlength="30" />
                    </div>

                    <div class="account-copy">
                        <h1 id="welcomeName" class="account-title">أهلاً</h1>
                        <p id="welcomeMessage" class="account-subtitle">
                            صباح الخير، ك سعيد
                        </p>
                    </div>
                </div>

                <div class="account-icon" aria-label="حساب Firebase">
                    <i class="fa-solid fa-cloud"></i>
                </div>
            </div>
        </div>
    </div>

    <script>
        const userNameInput = document.getElementById('userName');
        const welcomeName = document.getElementById('welcomeName');
        const welcomeMessage = document.getElementById('welcomeMessage');

        function updateGreeting() {
            const name = userNameInput.value.trim();
            const hour = new Date().getHours();
            const greeting = hour < 12 ? 'صباح الخير' : 'مساء الخير';

            welcomeMessage.textContent = `${greeting}، ك سعيد`;
            welcomeName.textContent = name ? `أهلاً ${name}` : 'أهلاً';
        }

        userNameInput.addEventListener('input', updateGreeting);
        updateGreeting();
    </script>

    <footer class="site-footer">
        <div class="site-footer__text">سمية • <span id="siteDate"></span></div>
    </footer>

    <script>
        const siteDate = document.getElementById('siteDate');
        const today = new Date();
        const formattedDate = today.toLocaleDateString('ar-EG', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
        });
        siteDate.textContent = formattedDate;
    </script>
</body>
</html>
